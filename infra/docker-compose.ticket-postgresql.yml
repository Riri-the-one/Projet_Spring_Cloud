# Include base + postgresql + ticket overlays. Provision the domain explicitly before starting Ticket.
services:
  postgres:
    secrets:
      - postgres_ticket_password
  ticket-service:
    environment:
      SPRING_PROFILES_ACTIVE: postgresql
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888,configtree:/run/secrets/ticket/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketflow_ticket
      SPRING_DATASOURCE_USERNAME: ticketflow_ticket
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"
      SPRING_FLYWAY_CLEAN_DISABLED: "true"
    secrets:
      - source: postgres_ticket_password
        target: /run/secrets/ticket/spring.datasource.password
    depends_on:
      postgres:
        condition: service_healthy
secrets:
  postgres_ticket_password:
    file: ${TICKETFLOW_POSTGRES_SECRETS_DIR:-./postgresql/.local}/ticket.password
