# Optional first-lot Ticket demo. No producer/consumer, seed data or PostgreSQL account.
services:
  ticket-service:
    profiles: [ticket]
    build:
      context: ..
      dockerfile: services/ticket-service/Dockerfile
    ports:
      - "127.0.0.1:${TICKETFLOW_TICKET_PORT:-8084}:8084"
    environment:
      SPRING_PROFILES_ACTIVE: demo-h2
      SPRING_DATASOURCE_URL: jdbc:h2:mem:tickets
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_CLIENT_REFRESH_ENABLE: "false"
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/ticketflow
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ticketflow/protocol/openid-connect/certs
      TICKETFLOW_JWT_AUDIENCE: ticketflow-api
      SERVER_PORT: "8084"
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 4 http://localhost:8084/actuator/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
