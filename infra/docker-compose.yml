# Local university demonstration: Gateway JWT protection (phase 1), not production security.
name: ticketflow-arij

x-health: &health
  test: ["CMD-SHELL", "curl --fail --silent --max-time 4 http://localhost:$${SERVER_PORT}/actuator/health > /dev/null"]
  interval: 10s
  timeout: 5s
  retries: 18
  start_period: 60s

x-client-env: &client-env
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  EUREKA_CLIENT_REFRESH_ENABLE: "false"
  JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/ticketflow-realm.json:/opt/keycloak/data/import/ticketflow-realm.json:ro
      - ticketflow-keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  config-server:
    build:
      context: ..
      dockerfile: services/config-server/Dockerfile
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      SERVER_PORT: "8888"
      SPRING_PROFILES_ACTIVE: native
      CONFIG_REPO_LOCATION: file:/config-repo/
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m
    volumes:
      - ./config-demo:/config-repo:ro
    healthcheck: *health

  discovery-server:
    build:
      context: ..
      dockerfile: services/discovery-server/Dockerfile
    ports:
      - "127.0.0.1:8761:8761"
    environment:
      SERVER_PORT: "8761"
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m
    healthcheck: *health

  customer-service:
    build:
      context: ..
      dockerfile: services/customer-service/Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      <<: *client-env
      SERVER_PORT: "8081"
      EUREKA_INSTANCE_INSTANCE_ID: customer-service:8081
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/ticketflow
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ticketflow/protocol/openid-connect/certs
      TICKETFLOW_JWT_AUDIENCE: ticketflow-api
    depends_on:
      keycloak:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck: *health

  event-service:
    build:
      context: ..
      dockerfile: services/event-service/Dockerfile
    environment:
      <<: *client-env
      SERVER_PORT: "8082"
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck: *health

  booking-service:
    build:
      context: ..
      dockerfile: services/booking-service/Dockerfile
    environment:
      <<: *client-env
      SERVER_PORT: "8083"
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      event-service:
        condition: service_healthy
    healthcheck: *health

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      <<: *client-env
      SERVER_PORT: "8080"
      EUREKA_INSTANCE_INSTANCE_ID: api-gateway:8080
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_DISCOVERY_LOCATOR_ENABLED: "false"
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/ticketflow
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ticketflow/protocol/openid-connect/certs
      TICKETFLOW_JWT_AUDIENCE: ticketflow-api
      TICKETFLOW_CORS_ORIGINS: ${TICKETFLOW_CORS_ORIGINS:-http://localhost:4200}
    depends_on:
      keycloak:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    healthcheck: *health

volumes:
  ticketflow-keycloak-data:
