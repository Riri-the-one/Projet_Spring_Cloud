# Local university demonstration only: no authentication yet; host ports bind to loopback.
name: ticketflow-arij

x-health: &health
  test: ["CMD-SHELL", "curl --fail --silent --max-time 4 http://localhost:$${SERVER_PORT}/actuator/health > /dev/null"]
  interval: 10s
  timeout: 5s
  retries: 18
  start_period: 60s

x-client-env: &client-env
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  EUREKA_CLIENT_REFRESH_ENABLE: "false"
  JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m

services:
  config-server:
    build:
      context: ..
      dockerfile: services/config-server/Dockerfile
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      SERVER_PORT: "8888"
      SPRING_PROFILES_ACTIVE: native
      CONFIG_REPO_LOCATION: file:/config-repo/
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m
    volumes:
      - ./config-demo:/config-repo:ro
    healthcheck: *health

  discovery-server:
    build:
      context: ..
      dockerfile: services/discovery-server/Dockerfile
    ports:
      - "127.0.0.1:8761:8761"
    environment:
      SERVER_PORT: "8761"
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m
    healthcheck: *health

  customer-service:
    build:
      context: ..
      dockerfile: services/customer-service/Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      <<: *client-env
      SERVER_PORT: "8081"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck: *health

  event-service:
    build:
      context: ..
      dockerfile: services/event-service/Dockerfile
    environment:
      <<: *client-env
      SERVER_PORT: "8082"
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck: *health

  booking-service:
    build:
      context: ..
      dockerfile: services/booking-service/Dockerfile
    environment:
      <<: *client-env
      SERVER_PORT: "8083"
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      event-service:
        condition: service_healthy
    healthcheck: *health

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      <<: *client-env
      SERVER_PORT: "8080"
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_DISCOVERY_LOCATOR_ENABLED: "false"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    healthcheck: *health
