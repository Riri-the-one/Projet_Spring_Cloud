name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp verify

  postgresql-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PostgreSQL credentials, isolation and persistence
        shell: pwsh
        run: |
          ./tools/Initialize-PostgresqlDev.ps1
          ./tools/Test-PostgresqlInfra.ps1
          ./tools/Test-PostgresqlInfra.ps1 -Recreate
