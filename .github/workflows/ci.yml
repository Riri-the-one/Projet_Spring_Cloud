name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp verify

  postgresql-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PostgreSQL credentials, isolation and persistence
        shell: pwsh
        run: |
          ./tools/Initialize-PostgresqlDev.ps1
          ./tools/Test-PostgresqlInfra.ps1
          ./tools/Test-PostgresqlInfra.ps1 -Recreate

  customer-postgresql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Test Customer migrations, JWT policies and transactions on PostgreSQL
        shell: pwsh
        run: |
          ./tools/Initialize-PostgresqlDev.ps1
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.postgresql.yml --profile postgresql up -d --no-deps --wait --wait-timeout 180 postgres
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL startup failed' }
          ./tools/Test-CustomerPostgresql.ps1

  kafka-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Verify Kafka Docker and host clients, topics and persistent storage
        shell: pwsh
        run: |
          ./tools/Test-KafkaInfra.ps1
          ./tools/Test-KafkaInfra.ps1 -Recreate
