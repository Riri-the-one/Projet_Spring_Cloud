spring:
  application:
    name: ticket-service
  cloud:
    config:
      enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
eureka:
  client:
    enabled: false
server:
  port: 0
ticketflow:
  customer-url: http://127.0.0.1:1
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
logging:
  level:
    org.hibernate.orm.jdbc.error: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
