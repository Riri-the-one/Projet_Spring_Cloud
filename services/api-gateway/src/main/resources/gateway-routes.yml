spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          default-filters:
            - PreserveHostHeader
            - AddResponseHeader=X-Served-By, api-gateway
          routes:
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/customers/**
            - id: event-service
              uri: lb://event-service
              predicates:
                - Path=/api/events/**
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings/**
