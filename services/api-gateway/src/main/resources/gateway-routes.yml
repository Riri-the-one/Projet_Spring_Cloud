spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          default-filters:
            - RemoveRequestHeader=X-Roles
            - RemoveRequestHeader=X-User-Id
            - RemoveRequestHeader=X-Customer-Id
            - PreserveHostHeader
            - AddResponseHeader=X-Served-By, api-gateway
          routes:
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/customers/**
            - id: event-service
              uri: lb://event-service
              predicates:
                - Path=/api/events/**
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings/**
            - id: ticket-reads
              uri: lb://ticket-service
              predicates:
                - Path=/api/tickets/me,/api/tickets/{id},/api/tickets/bookings/{bookingId}
                - Method=GET
            - id: ticket-validity
              uri: lb://ticket-service
              predicates:
                - Path=/api/tickets/{id}/validity
                - Method=POST
            - id: notification-reads
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/me,/api/notifications/{id:[0-9a-fA-F-]+}
                - Method=GET
