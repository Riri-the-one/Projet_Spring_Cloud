spring.application.name=event-service
server.port=8082

# Central configuration (step-05). "optional:" = the service still starts if the Config Server is
# down (it then uses only its local values). Values served by the server win over this file.
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${EVENT_KEYCLOAK_ISSUER:http://localhost:8080/realms/ticketflow}
spring.security.oauth2.resourceserver.jwt.audiences=${EVENT_KEYCLOAK_AUDIENCE:event-service}
ticketflow.security.booking-subject=${BOOKING_SERVICE_SUBJECT:}