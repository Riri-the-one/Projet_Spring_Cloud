
# Connexion PostgreSQL du microservice event-service
spring.datasource.url=jdbc:postgresql://localhost:5433/ticketflow_event
spring.datasource.username=ticketflow_event
spring.datasource.password=${TICKETFLOW_EVENT_DB_PASSWORD}

# Hibernate ne doit pas creer les tables automatiquement
spring.jpa.hibernate.ddl-auto=validate

# Activation des migrations Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
