spring:
  datasource:
    url: ${CUSTOMER_DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/ticketflow_customer}
    username: ticketflow_customer
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration/customer
    default-schema: public
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
  sql:
    init:
      mode: never
